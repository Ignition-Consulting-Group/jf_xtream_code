version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      jellyfin:
        patterns: ["Jellyfin.*"]
    ignore:
      # Compiled against the copy the Jellyfin server ships; it moves with Jellyfin, not on its own.
      - dependency-name: "Polly.Core"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /tools/FakeXtreamServer
    schedule:
      interval: weekly
