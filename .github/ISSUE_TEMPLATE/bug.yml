name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin and Jellyfin versions
      placeholder: "plugin 0.1.0, Jellyfin 12.2.0"
    validations:
      required: true
  - type: textarea
    id: quirk
    attributes:
      label: Provider quirk
      description: >
        If the provider response looks unusual, paste the relevant JSON or XMLTV snippet.
        Remove your provider URL, username, password and any real stream IDs first.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Jellyfin log excerpt
      render: text
