name: Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jellyfin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/XtreamPro.IntegrationTests --filter-trait "Category=Container"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: jellyfin-logs
          path: tests/XtreamPro.IntegrationTests/bin/**/jellyfin.log

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build tests/XtreamPro.UiTests
      - run: pwsh tests/XtreamPro.UiTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --project tests/XtreamPro.UiTests --no-build
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: ui-logs
          path: tests/XtreamPro.UiTests/bin/**/jellyfin.log
