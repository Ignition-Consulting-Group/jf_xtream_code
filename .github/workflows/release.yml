name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install jprm==1.1.0
      - name: Build plugin zip
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          jprm --verbosity=warning plugin build src/Jellyfin.Plugin.XtreamPro --output "$RUNNER_TEMP/out" --version "$VERSION"
          cd "$RUNNER_TEMP/out" && sha256sum *.zip > checksums.sha256
      - name: Attach to release
        run: gh release upload "$TAG" "$RUNNER_TEMP"/out/*.zip "$RUNNER_TEMP/out/checksums.sha256" --clobber
      - name: Update plugin repository manifest
        run: |
          if git ls-remote --exit-code origin gh-pages; then
            git fetch origin gh-pages:gh-pages
            git worktree add "$RUNNER_TEMP/pages" gh-pages
          else
            git worktree add --orphan -b gh-pages "$RUNNER_TEMP/pages"
            jprm repo init "$RUNNER_TEMP/pages"
          fi
          zip=$(ls "$RUNNER_TEMP"/out/*.zip)
          jprm repo add --plugin-url "https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$zip")" "$RUNNER_TEMP/pages" "$zip"
          cd "$RUNNER_TEMP/pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: publish $TAG to the plugin repository"
          git push origin gh-pages
